# Deploys the production Static Web App (go-green-hr-prod) from the `production` branch.
# The demo site (go-green-hr) keeps deploying from `main`. To release, merge main into production.
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN_PROD
# (Azure portal > go-green-hr-prod > Manage deployment token).
name: Deploy go-green-hr-prod

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Azure Static Web Apps (production)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app
          api_location: api
          output_location: ""
          skip_app_build: true
